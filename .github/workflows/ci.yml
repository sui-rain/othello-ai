name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token; no secrets are used by any job in this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard (protected paths, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Take judge scripts from main, not from the PR
        run: |
          mkdir -p "$RUNNER_TEMP/judge"
          if git cat-file -e origin/main:judge/check_protected.sh 2>/dev/null; then
            for f in check_protected.sh check_deps.sh protected-paths.txt allowed-deps.txt; do
              git show "origin/main:judge/$f" > "$RUNNER_TEMP/judge/$f"
            done
          else
            cp judge/* "$RUNNER_TEMP/judge/"   # bootstrap: main has no judge yet
          fi
      - name: Protected paths (auto/ branches only)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: bash "$RUNNER_TEMP/judge/check_protected.sh" origin/main "$HEAD_REF" "$RUNNER_TEMP/judge/protected-paths.txt"
      - name: Dependency allow-list
        run: bash "$RUNNER_TEMP/judge/check_deps.sh" "$RUNNER_TEMP/judge/allowed-deps.txt"

  test:
    name: fmt, clippy, tests, deep perft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install   # reads rust-toolchain.toml
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Perft depth 10 and 11 (release)
        run: cargo test --locked --release -p othello-engine -- --ignored
