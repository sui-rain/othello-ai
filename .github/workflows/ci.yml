name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token; no secrets are used by any job in this workflow.
# Changes to this file are blocked by the Guard workflow, which runs from main.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt, clippy, tests, deep perft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install   # reads rust-toolchain.toml
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Perft depth 10 and 11 (release)
        run: cargo test --locked --release -p othello-engine -- --ignored
