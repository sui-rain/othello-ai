name: Guard

# pull_request_target runs this workflow file from main, so a pull request
# cannot rewrite its own guard. It never checks out, builds or runs PR code:
# the PR head is only fetched as git data and diffed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard (protected paths, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main (trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          test "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA"
      - name: Protected paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash judge/check_protected.sh "$BASE_SHA" "$HEAD_SHA" judge/protected-paths.txt
      - name: Dependency allow-list
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash judge/check_deps.sh "$HEAD_SHA" judge/allowed-deps.txt judge/allowed-local-crates.txt
