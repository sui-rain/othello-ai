name: Report

# Every morning (07:00 JST).
# - bench: builds and benchmarks main with NO credentials (main's engine is code
#   merged by the nightly loop).
# - publish: collects the night's judge results, appends to the `data` branch,
#   tags main and deploys the graph page. Runs only trusted Python from main;
#   never executes engine code.
on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 JST
  workflow_dispatch:

permissions: {}

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.sha.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - id: sha
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install valgrind
        run: sudo apt-get update -q && sudo apt-get install -y -q valgrind
      - name: Build main
        run: rustup toolchain install && cargo build --release --locked
      - name: Benchmark
        run: python3 judge/report.py bench --engine target/release/othello --bench bench --out bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json
          retention-days: 7

  publish:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # data branch and champion tags
      actions: read     # list judge runs, download their reports
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Check out main at the benchmarked commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bench.outputs.commit || 'main' }}
          fetch-depth: 0
      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git worktree add ../data origin/data -B data
          else
            git worktree add --orphan -b data ../data
          fi
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench
          path: benchout
      - name: Collect and build the page
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 judge/report.py publish --repo "$REPO" --data ../data --site _site \
            --bench-json benchout/bench.json --commit "$(git rev-parse HEAD)"
      - name: Save data branch
        working-directory: ../data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.csv bench.csv
          git commit -m "report $(TZ=Asia/Tokyo date +%F)" || echo "nothing to commit"
          git push origin data
      - name: Tag main as champion
        run: |
          tag="champion-$(TZ=Asia/Tokyo date +%Y%m%d)"
          last="$(git describe --tags --abbrev=0 --match 'champion-*' 2>/dev/null || true)"
          if [ -z "$last" ] || [ "$(git rev-list -n1 "$last")" != "$(git rev-parse HEAD)" ]; then
            git tag "$tag" && git push origin "$tag" || echo "tag exists"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
